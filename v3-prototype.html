<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plugin Groups</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            DEFAULT: '#5b8a00',
            dark:    '#4a7000',
            darker:  '#3a5800',
            light:   '#eef4e0',
            border:  '#7aaa10',
          },
          wp: {
            bar:    '#1d2327',
            menu:   '#2c3338',
            hover:  '#33373c',
          }
        },
        fontFamily: {
          sans: ['-apple-system','BlinkMacSystemFont','"Segoe UI"','Roboto','Oxygen-Sans','Ubuntu','Cantarell','"Helvetica Neue"','sans-serif'],
        }
      }
    }
  }
</script>
<style>
  body { font-size: 13px; }
  .wp-row { transition: background 0.08s; }
  .wp-row:hover { background-color: #f0f6e4; }
  .wp-row.selected { background-color: #eef4e0; }
  input[type="checkbox"] { accent-color: #5b8a00; width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; }
  .group-row { transition: background 0.08s; }
  .group-row:hover { background-color: #f6f7f7; }
  .group-row.active-group { border-left: 3px solid #5b8a00; background-color: #eef4e0; }
  .preset-row { transition: background 0.08s; }
  .preset-row:hover { background-color: #f6f7f7; }
  .btn-primary { background: #5b8a00; color: white; border: 1px solid #4a7000; font-size: 13px; padding: 4px 10px; cursor: pointer; border-radius: 3px; transition: background 0.1s; display: inline-flex; align-items: center; gap: 5px; }
  .btn-primary:hover { background: #4a7000; }
  .btn-secondary { background: #f6f7f7; color: #2c3338; border: 1px solid #c3c4c7; font-size: 13px; padding: 4px 10px; cursor: pointer; border-radius: 3px; transition: background 0.1s; display: inline-flex; align-items: center; gap: 5px; }
  .btn-secondary:hover { background: #e9e9e9; border-color: #999; }
  .btn-danger { background: #f6f7f7; color: #b32d2e; border: 1px solid #c3c4c7; font-size: 13px; padding: 4px 10px; cursor: pointer; border-radius: 3px; transition: all 0.1s; display: inline-flex; align-items: center; gap: 5px; }
  .btn-danger:hover { background: #fdf0f0; border-color: #b32d2e; }
  .wp-input { border: 1px solid #c3c4c7; border-radius: 3px; padding: 4px 8px; font-size: 13px; outline: none; width: 100%; }
  .wp-input:focus { border-color: #5b8a00; box-shadow: 0 0 0 1px #5b8a00; }
  .tag { display: inline-flex; align-items: center; gap: 3px; background: #5b8a00; color: white; border-radius: 2px; padding: 1px 5px; font-size: 11px; font-weight: 500; }
  .tag-gray { background: #c3c4c7; color: #2c3338; }
  .drag-handle { cursor: grab; color: #c3c4c7; }
  .drag-handle:hover { color: #5b8a00; }
  .drag-handle:active { cursor: grabbing; }
  .group-row.drag-over { background: #eef4e0; outline: 2px dashed #5b8a00; outline-offset: -2px; }
  .section-title { font-size: 13px; font-weight: 600; color: #1d2327; border-bottom: 1px solid #c3c4c7; padding-bottom: 8px; margin-bottom: 0; }
  .count-pill { background: #ddd; color: #555; border-radius: 10px; padding: 0 7px; font-size: 11px; font-weight: 600; }
  .count-pill.green { background: #5b8a00; color: white; }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #f1f1f1; } ::-webkit-scrollbar-thumb { background: #c3c4c7; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #999; }
  /* Toast */
  #toast { transition: opacity 0.2s, transform 0.2s; }
  /* Modal */
  .modal-bg { background: rgba(0,0,0,0.5); }
</style>
</head>
<body class="bg-gray-100 text-gray-800">

<!-- Page header -->
<div class="bg-brand px-6 py-3 flex items-center gap-3 shadow-sm">
  <h1 class="text-white font-semibold text-lg tracking-tight">Plugin Groups</h1>
  <span class="bg-white/20 text-white text-xs px-2 py-0.5 rounded font-mono">3.0.0</span>
  <div class="flex gap-2 ml-4">
    <button class="btn-secondary text-xs" onclick="saveSettings()">Save Settings</button>
    <button class="btn-secondary text-xs">Export</button>
    <button class="btn-secondary text-xs">Import</button>
  </div>
</div>

<!-- Sub-nav tabs -->
<div class="bg-brand-dark flex border-b border-brand-darker">
  <button class="text-white text-sm px-5 py-2 border-b-2 border-white font-medium">Groups Management</button>
  <button class="text-white/70 text-sm px-5 py-2 hover:text-white transition-colors">Settings</button>
</div>

<!-- Main Content -->
<div class="flex gap-0 h-[calc(100vh-95px)]">

  <!-- ── Column 1: Plugins ── -->
  <div class="w-72 bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
    <div class="px-4 pt-4 pb-3 border-b border-gray-200">
      <div class="section-title flex items-center justify-between mb-3">
        <span>Plugins</span>
        <span class="count-pill" id="pluginCountPill">0</span>
      </div>
      <input class="wp-input mb-2" type="text" id="pluginSearch" placeholder="Search plugins…" oninput="render()">
      <div class="flex items-center gap-2">
        <label class="flex items-center gap-1.5 cursor-pointer text-xs text-gray-600 select-none">
          <input type="checkbox" id="ungroupedFilter" onchange="render()"> Ungrouped only
        </label>
      </div>
    </div>

    <!-- Select all + Send bar -->
    <div class="px-4 py-2 border-b border-gray-200 flex items-center gap-2 bg-gray-50">
      <label class="flex items-center gap-1.5 cursor-pointer select-none text-xs font-medium">
        <input type="checkbox" id="selectAllCb" onchange="toggleSelectAll()"> Select all
      </label>
      <button class="btn-primary text-xs ml-auto" id="sendBtn" onclick="openSendModal()" disabled style="opacity:0.5">
        Send to Groups
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <div class="overflow-y-auto flex-1" id="pluginsList"></div>
  </div>

  <!-- ── Column 2: Groups ── -->
  <div class="flex-1 bg-white border-r border-gray-200 flex flex-col min-w-0">
    <div class="px-4 pt-4 pb-3 border-b border-gray-200">
      <div class="section-title flex items-center justify-between mb-3">
        <span>Groups</span>
        <span class="count-pill green" id="groupCountPill">0</span>
      </div>
      <div class="flex items-center gap-2">
        <label class="flex items-center gap-1.5 cursor-pointer select-none text-xs font-medium">
          <input type="checkbox" id="selectAllGroupsCb" onchange="toggleSelectAllGroups()"> Select All
        </label>
        <button class="btn-danger text-xs ml-auto" id="deleteGroupsBtn" onclick="deleteSelectedGroups()" disabled style="opacity:0.5">
          Delete selected
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
        </button>
      </div>
    </div>
    <div class="overflow-y-auto flex-1" id="groupsList"></div>
    <div class="px-4 py-3 border-t border-gray-200 bg-gray-50">
      <button class="btn-secondary text-xs" onclick="openCreateGroupModal()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create new group
      </button>
    </div>
  </div>

  <!-- ── Column 3: Presets ── -->
  <div class="w-56 bg-white flex flex-col flex-shrink-0">
    <div class="px-4 pt-4 pb-3 border-b border-gray-200">
      <div class="section-title">Presets</div>
      <p class="text-xs text-gray-500 mt-2">Click a preset to create that group and auto-assign matching plugins.</p>
    </div>
    <div class="overflow-y-auto flex-1 py-1" id="presetsList"></div>
  </div>

</div>

<!-- ── Send to Groups Modal ── -->
<div id="sendModal" class="fixed inset-0 modal-bg z-50 flex items-center justify-center hidden">
  <div class="bg-white rounded shadow-xl w-96 border border-gray-300">
    <div class="bg-brand px-4 py-3 flex items-center justify-between rounded-t">
      <h2 class="text-white font-semibold text-sm">Send Plugins to Groups</h2>
      <button class="text-white/70 hover:text-white text-lg leading-none" onclick="closeSendModal()">✕</button>
    </div>
    <div class="p-4">
      <p class="text-xs text-gray-500 mb-3">Select which groups to add the <span id="sendCount" class="font-semibold text-gray-700"></span> selected plugin(s) to:</p>
      <div id="sendGroupList" class="border border-gray-200 rounded divide-y divide-gray-100 max-h-52 overflow-y-auto mb-4"></div>
      <div class="flex justify-end gap-2">
        <button class="btn-secondary text-xs" onclick="closeSendModal()">Cancel</button>
        <button class="btn-primary text-xs" onclick="confirmSend()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          Assign to Groups
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ── Create/Edit Group Modal ── -->
<div id="groupModal" class="fixed inset-0 modal-bg z-50 flex items-center justify-center hidden">
  <div class="bg-white rounded shadow-xl w-80 border border-gray-300">
    <div class="bg-brand px-4 py-3 flex items-center justify-between rounded-t">
      <h2 class="text-white font-semibold text-sm" id="groupModalTitle">Create New Group</h2>
      <button class="text-white/70 hover:text-white text-lg leading-none" onclick="closeGroupModal()">✕</button>
    </div>
    <div class="p-4">
      <label class="block text-xs font-medium text-gray-700 mb-1">Group Name</label>
      <input class="wp-input mb-1" type="text" id="groupNameInput" placeholder="e.g. Security" onkeydown="if(event.key==='Enter')saveGroupModal()">
      <div class="flex justify-end gap-2 mt-4">
        <button class="btn-secondary text-xs" onclick="closeGroupModal()">Cancel</button>
        <button class="btn-primary text-xs" onclick="saveGroupModal()">Save Group</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-wp-bar text-white text-xs px-4 py-2 rounded shadow-lg opacity-0 pointer-events-none translate-y-4 z-50">
  Saved
</div>

<script>
// ── Data ─────────────────────────────────────────────────

const PRESETS = [
  { id:'pr1',  name:'WooCommerce',     keywords:['woocommerce','wc-','wc_'] },
  { id:'pr2',  name:'SEO',             keywords:['seo','yoast','rank-math','all-in-one-seo'] },
  { id:'pr3',  name:'Security',        keywords:['security','wordfence','sucuri','cerber','firewall','malware'] },
  { id:'pr4',  name:'Performance',     keywords:['cache','speed','performance','optimize','minif','compress','cdn'] },
  { id:'pr5',  name:'Forms',           keywords:['form','gravity','ninja-form','wpforms','contact-form','caldera'] },
  { id:'pr6',  name:'Backup',          keywords:['backup','updraft','duplicator','migrate'] },
  { id:'pr7',  name:'Media',           keywords:['media','image','photo','gallery','video','slider','smush'] },
  { id:'pr8',  name:'E-Commerce',      keywords:['ecommerce','e-commerce','shop','payment','stripe','paypal','cart'] },
  { id:'pr9',  name:'Analytics',       keywords:['analytic','statistic','google-analytics','matomo','tracking','pixel'] },
  { id:'pr10', name:'Page Builder',    keywords:['elementor','divi','beaver','visual-composer','wpbakery','gutenberg','block'] },
  { id:'pr11', name:'Membership',      keywords:['member','subscription','restrict','account','user','profile'] },
  { id:'pr12', name:'Developer Tools', keywords:['debug','monitor','query','log','admin','developer','tool'] },
];

const PLUGINS = [
  { id:'p1',  name:'Akismet Anti-spam',     slug:'akismet',                version:'5.3.1' },
  { id:'p2',  name:'Classic Editor',        slug:'classic-editor',         version:'1.6.3' },
  { id:'p3',  name:'Contact Form 7',        slug:'contact-form-7',         version:'5.9.0' },
  { id:'p4',  name:'Elementor',             slug:'elementor',              version:'3.21.4' },
  { id:'p5',  name:'Gravity Forms',         slug:'gravityforms',           version:'2.8.6' },
  { id:'p6',  name:'Query Monitor',         slug:'query-monitor',          version:'3.16.4' },
  { id:'p7',  name:'Rank Math SEO',         slug:'seo-by-rank-math',       version:'1.0.219' },
  { id:'p8',  name:'Smush Image Compress',  slug:'wp-smushit',             version:'3.16.3' },
  { id:'p9',  name:'UpdraftPlus Backup',    slug:'updraftplus',            version:'1.24.3' },
  { id:'p10', name:'W3 Total Cache',        slug:'w3-total-cache',         version:'2.7.4' },
  { id:'p11', name:'WooCommerce',           slug:'woocommerce',            version:'9.0.2' },
  { id:'p12', name:'WooCommerce Payments',  slug:'woocommerce-payments',   version:'7.9.0' },
  { id:'p13', name:'WooCommerce Shipping',  slug:'woocommerce-shipping',   version:'3.1.0' },
  { id:'p14', name:'Wordfence Security',    slug:'wordfence',              version:'7.11.5' },
  { id:'p15', name:'WPForms Lite',          slug:'wpforms-lite',           version:'1.9.0' },
  { id:'p16', name:'Yoast SEO',             slug:'wordpress-seo',          version:'22.4' },
  { id:'p17', name:'Jetpack',               slug:'jetpack',                version:'13.4' },
  { id:'p18', name:'Really Simple SSL',     slug:'really-simple-ssl',      version:'7.2.3' },
  { id:'p19', name:'Redirection',           slug:'redirection',            version:'5.4.2' },
  { id:'p20', name:'WP Migrate DB',         slug:'wp-migrate-db',          version:'2.6.4' },
];

let groups = [
  { id:'g1', name:'WooCommerce', plugins:['p11','p12','p13'] },
  { id:'g2', name:'SEO',         plugins:['p7','p16'] },
  { id:'g3', name:'Security',    plugins:['p14','p18'] },
];

let selectedPlugins = new Set();
let selectedGroups  = new Set();
let sendTargetGroups = new Set();
let editingGroupId  = null;
let dragSrcGroupId  = null;
let dragPluginId    = null;

// ── Helpers ───────────────────────────────────────────────

function getGroupsForPlugin(pid) { return groups.filter(g => g.plugins.includes(pid)); }
function isUngrouped(pid) { return !groups.some(g => g.plugins.includes(pid)); }
function visiblePlugins() {
  const q  = document.getElementById('pluginSearch').value.toLowerCase();
  const ug = document.getElementById('ungroupedFilter').checked;
  return PLUGINS.filter(p =>
    (!q || p.name.toLowerCase().includes(q) || p.slug.toLowerCase().includes(q)) &&
    (!ug || isUngrouped(p.id))
  );
}

// ── Render ────────────────────────────────────────────────

function render() {
  renderPlugins();
  renderGroups();
  renderPresets();
  updateSendBtn();
  updateDeleteBtn();
}

function renderPlugins() {
  const list = document.getElementById('pluginsList');
  const vis  = visiblePlugins();
  document.getElementById('pluginCountPill').textContent = vis.length;

  list.innerHTML = vis.map(p => {
    const inGroups = getGroupsForPlugin(p.id);
    const isSel    = selectedPlugins.has(p.id);
    const tags     = inGroups.map(g => `<span class="tag">${g.name}</span>`).join('');
    return `
      <div class="wp-row px-4 py-2 flex items-center gap-2 border-b border-gray-100 cursor-pointer ${isSel ? 'selected' : ''}"
           onclick="rowClick(event,'${p.id}')">
        <input type="checkbox" ${isSel ? 'checked' : ''} onclick="event.stopPropagation();togglePlugin('${p.id}')">
        <span class="flex-1 font-medium text-gray-800 truncate">${p.name}</span>
        <div class="flex gap-1 flex-wrap justify-end">${tags}</div>
        <span class="text-gray-400 text-xs font-mono ml-1 flex-shrink-0">${p.version}</span>
      </div>`;
  }).join('');

  // Sync select-all checkbox
  const cb = document.getElementById('selectAllCb');
  cb.indeterminate = selectedPlugins.size > 0 && selectedPlugins.size < vis.length;
  cb.checked = vis.length > 0 && vis.every(p => selectedPlugins.has(p.id));
}

function renderGroups() {
  const list = document.getElementById('groupsList');
  document.getElementById('groupCountPill').textContent = groups.length;

  if (!groups.length) {
    list.innerHTML = `<div class="px-4 py-8 text-center text-gray-400 text-xs">No groups yet. Create one below.</div>`;
    return;
  }

  list.innerHTML = groups.map(g => {
    const isSel = selectedGroups.has(g.id);
    const pluginRows = g.plugins.map(pid => {
      const p = PLUGINS.find(x => x.id === pid); if (!p) return '';
      return `
        <div class="flex items-center gap-2 py-1.5 px-3 hover:bg-gray-50 group/pr border-b border-gray-100 last:border-0"
             draggable="true"
             ondragstart="startPluginDrag(event,'${p.id}','${g.id}')">
          <svg class="drag-handle w-3 h-3 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/>
            <circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/>
            <circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/>
          </svg>
          <span class="flex-1 text-xs text-gray-700 truncate">${p.name}</span>
          <span class="text-gray-400 text-xs font-mono">${p.version}</span>
          <button class="opacity-0 group-hover/pr:opacity-100 text-gray-400 hover:text-red-500 ml-1 transition-opacity text-xs leading-none"
                  onclick="removePlugin('${g.id}','${p.id}')" title="Remove">✕</button>
        </div>`;
    }).join('');

    return `
      <div class="group-row border-b border-gray-200 ${isSel ? 'bg-brand-light' : ''}"
           id="gc-${g.id}"
           ondragover="onGroupDragOver(event,'${g.id}')"
           ondragleave="onGroupDragLeave('${g.id}')"
           ondrop="onGroupDrop(event,'${g.id}')">
        <!-- Group header row -->
        <div class="flex items-center gap-2 px-4 py-2.5 cursor-pointer" onclick="toggleGroupExpand('${g.id}')">
          <svg class="drag-handle w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/>
            <circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/>
            <circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/>
          </svg>
          <input type="checkbox" ${isSel ? 'checked' : ''} onclick="event.stopPropagation();toggleGroup('${g.id}')">
          <span class="flex-1 font-semibold text-gray-800">${g.name}</span>
          <span class="count-pill ${g.plugins.length ? 'green' : ''} mr-2">${g.plugins.length}</span>
          <button class="text-gray-400 hover:text-brand transition-colors" onclick="event.stopPropagation();openEditGroupModal('${g.id}')" title="Rename">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <svg class="w-3.5 h-3.5 text-gray-400 transition-transform ${g._open ? 'rotate-180' : ''}" id="chevron-${g.id}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <!-- Expanded plugin list -->
        ${g._open ? `
          <div class="border-t border-gray-200 bg-gray-50">
            ${pluginRows || '<div class="px-4 py-2 text-xs text-gray-400 italic">No plugins assigned. Drag plugins here or use "Send to Groups".</div>'}
            <div class="px-3 py-1.5 text-xs text-brand-dark border-t border-dashed border-brand/30 bg-brand-light/40 text-center italic text-brand/60" id="drop-hint-${g.id}">
              Drop plugins here
            </div>
          </div>` : ''}
      </div>`;
  }).join('');

  // Update select-all groups checkbox
  const cb = document.getElementById('selectAllGroupsCb');
  cb.indeterminate = selectedGroups.size > 0 && selectedGroups.size < groups.length;
  cb.checked = groups.length > 0 && groups.every(g => selectedGroups.has(g.id));
}

function renderPresets() {
  const list = document.getElementById('presetsList');
  list.innerHTML = PRESETS.map(pr => {
    const matchCount = PLUGINS.filter(p => pr.keywords.some(k => p.slug.toLowerCase().includes(k))).length;
    const groupExists = groups.some(g => g.name.toLowerCase() === pr.name.toLowerCase());
    return `
      <div class="preset-row px-4 py-2 flex items-center gap-2 border-b border-gray-100 cursor-pointer"
           onclick="applyPreset('${pr.id}')" title="${matchCount} matching plugin(s) found">
        <input type="checkbox" ${groupExists ? 'checked' : ''} onclick="event.preventDefault()">
        <span class="flex-1 text-sm text-gray-700">${pr.name}</span>
        ${matchCount ? `<span class="count-pill">${matchCount}</span>` : ''}
      </div>`;
  }).join('');
}

// ── Plugin Selection ──────────────────────────────────────

function rowClick(e, pid) {
  if (e.target.tagName === 'INPUT') return;
  togglePlugin(pid);
}
function togglePlugin(pid) {
  selectedPlugins.has(pid) ? selectedPlugins.delete(pid) : selectedPlugins.add(pid);
  render();
}
function toggleSelectAll() {
  const cb  = document.getElementById('selectAllCb');
  const vis = visiblePlugins();
  if (cb.checked) vis.forEach(p => selectedPlugins.add(p.id));
  else vis.forEach(p => selectedPlugins.delete(p.id));
  render();
}
function updateSendBtn() {
  const btn = document.getElementById('sendBtn');
  const has = selectedPlugins.size > 0;
  btn.disabled = !has;
  btn.style.opacity = has ? '1' : '0.5';
  btn.innerHTML = has
    ? `Send ${selectedPlugins.size} to Groups <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`
    : `Send to Groups <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`;
}

// ── Group Selection ───────────────────────────────────────

function toggleGroup(gid) {
  selectedGroups.has(gid) ? selectedGroups.delete(gid) : selectedGroups.add(gid);
  render();
}
function toggleSelectAllGroups() {
  const cb = document.getElementById('selectAllGroupsCb');
  if (cb.checked) groups.forEach(g => selectedGroups.add(g.id));
  else selectedGroups.clear();
  render();
}
function deleteSelectedGroups() {
  if (!selectedGroups.size) return;
  groups = groups.filter(g => !selectedGroups.has(g.id));
  selectedGroups.clear();
  render();
  showToast(`Group(s) deleted`);
}
function updateDeleteBtn() {
  const btn = document.getElementById('deleteGroupsBtn');
  const has = selectedGroups.size > 0;
  btn.disabled = !has;
  btn.style.opacity = has ? '1' : '0.5';
}
function toggleGroupExpand(gid) {
  const g = groups.find(x => x.id === gid);
  if (g) g._open = !g._open;
  render();
}

// ── Group Actions ─────────────────────────────────────────

function removePlugin(gid, pid) {
  const g = groups.find(x => x.id === gid);
  g.plugins = g.plugins.filter(x => x !== pid);
  render();
}

// ── Send Modal ────────────────────────────────────────────

function openSendModal() {
  if (!selectedPlugins.size) return;
  sendTargetGroups.clear();
  document.getElementById('sendCount').textContent = selectedPlugins.size;
  document.getElementById('sendGroupList').innerHTML = groups.length
    ? groups.map(g => `
        <label class="flex items-center gap-2 px-3 py-2 hover:bg-gray-50 cursor-pointer">
          <input type="checkbox" onchange="toggleSendTarget('${g.id}',this.checked)">
          <span class="flex-1 text-sm text-gray-800">${g.name}</span>
          <span class="count-pill">${g.plugins.length}</span>
        </label>`).join('')
    : `<div class="px-3 py-3 text-xs text-gray-400 text-center">No groups yet.</div>`;
  document.getElementById('sendModal').classList.remove('hidden');
}
function closeSendModal() { document.getElementById('sendModal').classList.add('hidden'); }
function toggleSendTarget(gid, on) { on ? sendTargetGroups.add(gid) : sendTargetGroups.delete(gid); }
function confirmSend() {
  if (!sendTargetGroups.size) { closeSendModal(); return; }
  let added = 0;
  sendTargetGroups.forEach(gid => {
    const g = groups.find(x => x.id === gid);
    selectedPlugins.forEach(pid => { if (!g.plugins.includes(pid)) { g.plugins.push(pid); added++; } });
  });
  closeSendModal();
  selectedPlugins.clear();
  showToast(`${added} assignment(s) made across ${sendTargetGroups.size} group(s)`);
  render();
}

// ── Drag & Drop (plugins onto groups) ────────────────────

function startPluginDrag(e, pid, fromGid) {
  dragPluginId   = pid;
  dragSrcGroupId = fromGid;
  e.dataTransfer.effectAllowed = 'move';
}
function onGroupDragOver(e, gid) {
  e.preventDefault();
  document.getElementById('gc-' + gid)?.classList.add('drag-over');
}
function onGroupDragLeave(gid) {
  document.getElementById('gc-' + gid)?.classList.remove('drag-over');
}
function onGroupDrop(e, gid) {
  e.preventDefault();
  document.getElementById('gc-' + gid)?.classList.remove('drag-over');
  if (!dragPluginId) return;
  const tgt = groups.find(x => x.id === gid);
  if (!tgt) return;
  // Move from source group if dragged from within a group
  if (dragSrcGroupId && dragSrcGroupId !== gid) {
    const src = groups.find(x => x.id === dragSrcGroupId);
    if (src) src.plugins = src.plugins.filter(x => x !== dragPluginId);
  }
  if (!tgt.plugins.includes(dragPluginId)) {
    tgt.plugins.push(dragPluginId);
    tgt._open = true;
    showToast(`Plugin moved to "${tgt.name}"`);
  }
  dragPluginId = dragSrcGroupId = null;
  render();
}

// ── Group Modal ───────────────────────────────────────────

function openCreateGroupModal() {
  editingGroupId = null;
  document.getElementById('groupModalTitle').textContent = 'Create New Group';
  document.getElementById('groupNameInput').value = '';
  document.getElementById('groupModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('groupNameInput').focus(), 100);
}
function openEditGroupModal(gid) {
  editingGroupId = gid;
  const g = groups.find(x => x.id === gid);
  document.getElementById('groupModalTitle').textContent = 'Rename Group';
  document.getElementById('groupNameInput').value = g.name;
  document.getElementById('groupModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('groupNameInput').focus(), 100);
}
function closeGroupModal() { document.getElementById('groupModal').classList.add('hidden'); }
function saveGroupModal() {
  const name = document.getElementById('groupNameInput').value.trim();
  if (!name) return;
  if (editingGroupId) {
    groups.find(x => x.id === editingGroupId).name = name;
  } else {
    groups.push({ id: 'g' + Date.now(), name, plugins: [], _open: true });
  }
  closeGroupModal();
  render();
}

// ── Presets ───────────────────────────────────────────────

function applyPreset(prid) {
  const pr = PRESETS.find(x => x.id === prid);
  const matches = PLUGINS.filter(p => pr.keywords.some(k => p.slug.toLowerCase().includes(k)));
  if (!matches.length) { showToast(`No matching plugins found for "${pr.name}"`); return; }
  let g = groups.find(x => x.name.toLowerCase() === pr.name.toLowerCase());
  if (!g) { g = { id: 'g' + Date.now(), name: pr.name, plugins: [], _open: true }; groups.push(g); }
  else g._open = true;
  let added = 0;
  matches.forEach(p => { if (!g.plugins.includes(p.id)) { g.plugins.push(p.id); added++; } });
  showToast(added ? `"${pr.name}" group updated — ${added} plugin(s) added` : `"${pr.name}" already up to date`);
  render();
}

// ── Save / Toast ──────────────────────────────────────────

function saveSettings() { showToast('Settings saved'); }

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('opacity-0', 'translate-y-4');
  t.classList.add('opacity-100', 'translate-y-0');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    t.classList.add('opacity-0', 'translate-y-4');
    t.classList.remove('opacity-100', 'translate-y-0');
  }, 2500);
}

// Close modals on backdrop click
document.getElementById('sendModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeSendModal(); });
document.getElementById('groupModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeGroupModal(); });

render();
</script>
</body>
</html>
